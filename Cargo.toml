[package]
name = "pctl"
version = "0.8.0"
edition = "2024"
rust-version = "1.99"
description = "Small guarded tmux project-agent manager prototype"
license = "MIT"

[workspace]
members = ["crates/mdv"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "=0.29.0"
fs2 = "0.4"
mdv = { path = "crates/mdv" }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
