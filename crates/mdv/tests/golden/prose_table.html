<section data-b="0" data-src="0-20"><h1 id="결정-표-읽기">결정 표 읽기</h1></section>
<section data-b="1" data-src="21-511"><table><thead><tr><th class="align-none">항목</th><th class="align-none">결정과 이유</th><th class="align-none">확인할 것</th><th class="align-right">값</th></tr></thead><tbody><tr><td class="align-none">본문</td><td class="align-none">넓은 화면에서도 본문은 여든 칸까지만 사용하며 읽던 문단을 잃지 않도록 같은 시작점을 유지한다.</td><td class="align-none">답변 도착 전후 본문 위치를 확인한다.</td><td class="align-right">123456789.012</td></tr><tr><td class="align-none">표</td><td class="align-none">긴 설명은 같은 열 안에서 여러 줄로 나누고 숫자와 단위는 그대로 보존한다.</td><td class="align-none">좁은 화면에서 열 구분과 행 높이를 확인한다.</td><td class="align-right">-987654321.125</td></tr></tbody></table></section>
